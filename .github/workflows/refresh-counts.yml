name: Refresh PS3 player counts

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-player-counts
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh primary DNS from the published sheet
        run: python scripts/update_main_dns.py
      - name: Refresh supported PS3-only counts
        run: python scripts/update_player_counts.py
      - name: Save the updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-counts.json data/main-dns.json
          if git diff --cached --quiet; then
            echo "Player counts and primary DNS did not change."
          else
            git commit -m "Refresh PS3 live data [skip ci]"
            git push
          fi
